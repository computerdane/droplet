# Nightly performance gate (tests/perf.sh): plays a real loop under Xvfb with the flake's Mesa
# and fails on frame-time hitches. Nightly rather than per push: it downloads an hour of
# archive volumes and takes several minutes of software rendering.
name: Perf

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            nexrad/target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: |
            data/raw/basemap
            data/raw/KTLX20130520_*
          key: perf-data-v1  # basemap sources and the loop's archive files
      - name: Build
        run: nix develop -c bash -c 'cargo build --release && godot --headless --path . --import'
      - name: Frame times
        run: nix develop -c tests/perf.sh
