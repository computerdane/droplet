# Publish only artifacts from successful CI; never execute code from a PR here.
name: Pages

on:
  workflow_run:
    workflows: [CI, Preview lifecycle]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Pending runs can be coalesced safely: each run reconciles ALL current PRs/main.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      pull-requests: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run always executes the trusted default-branch publisher.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Reconcile tested builds and remove closed previews
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: node tools/pages/publish.mjs prepare --state "$RUNNER_TEMP/pages-state" --output "$RUNNER_TEMP/pages-site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages-site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Update preview links
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tools/pages/publish.mjs comment --state "$RUNNER_TEMP/pages-state"
