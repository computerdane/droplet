# Builds the web app (web/build.sh in the Nix dev shell) and publishes it to GitHub Pages.
# Pages cannot send COOP/COEP; the export's PWA service worker supplies them (see
# web/export_presets.template.cfg), so the first visit reloads once.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: data/raw/basemap
          key: basemap-sources-cb2023  # the downloaded Census + Natural Earth files
      - name: Basemap
        run: nix develop -c bash -c 'cargo build --release && nexrad basemap'
      - name: Build
        run: nix develop -c web/build.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
