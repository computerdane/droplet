[package]
name = "nexrad-wasm"
version = "0.1.0"
edition = "2024"
description = "Browser build of the nexrad decoder: raw Archive2 bytes in, droplet volume out"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nexrad = { path = "../nexrad", default-features = false }
js-sys = "0.3"
# Pinned to the wasm-bindgen-cli the flake provides; the two must match exactly.
wasm-bindgen = "=0.2.127"
